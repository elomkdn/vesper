schema_version = "0.2"

[application]
id = "io.github.elomkdn.Vesper"
name = "Vesper"
version = "0.1.0"
entrypoint = "src/main.py"

[platform]
ui_contract = "1"
semantics_contract = "1"

[responsive]
adaptive = true
test_widths = [360, 500, 1024, 1280]
input_modes = ["pointer", "touch", "keyboard"]
presentation_modes = ["windowed", "fullscreen-mobile"]

[distribution]
substrate = "flatpak"
flatpak_manifest = "flatpak/io.github.elomkdn.Vesper.json"
appstream_metadata = "data/io.github.elomkdn.Vesper.metainfo.xml"
desktop_file = "data/io.github.elomkdn.Vesper.desktop"
icon = "data/io.github.elomkdn.Vesper.svg"
portal_first = true
portals = ["settings", "location"]

[lifecycle]
app_data = "removable"
cache = "removable"
user_documents = "preserved"
reset_supported = true
uninstall_choices = ["keep-data", "remove-app-data"]

[conformance]
accessibility = true
keyboard = true
semantics = true
reduced_motion = true
evidence = "verification/luma-native-evidence.json"
